name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      changelog_version_code: ${{ steps.version.outputs.changelog_version_code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate tag against Gradle version metadata
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          GRADLE_FILE=app/build.gradle.kts

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Tag '$TAG' must look like vX.Y.Z or vX.Y.Z-<pre-release> (e.g. v0.9.0-beta.1)."
            exit 1
          fi

          VERSION_NAME=$(sed -n -E 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' "$GRADLE_FILE")
          BASE_CODE=$(sed -n -E 's/^val baseAppVersionCode = ([0-9]+).*/\1/p' "$GRADLE_FILE")
          DEFAULT_CODE=$(sed -n -E 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' "$GRADLE_FILE")
          echo "Tag: $TAG | versionName: $VERSION_NAME | baseAppVersionCode: $BASE_CODE | defaultConfig.versionCode: $DEFAULT_CODE"

          if [ "v${VERSION_NAME}" != "$TAG" ]; then
            echo "::error::Tag '$TAG' does not match versionName '$VERSION_NAME' in $GRADLE_FILE (expected tag 'v$VERSION_NAME')."
            exit 1
          fi
          # F-Droid checkupdates parses the literal defaultConfig.versionCode, while the
          # APKs use baseAppVersionCode; both must be bumped together.
          if [ -z "$BASE_CODE" ] || [ "$BASE_CODE" != "$DEFAULT_CODE" ]; then
            echo "::error::baseAppVersionCode ($BASE_CODE) and defaultConfig versionCode ($DEFAULT_CODE) must be equal."
            exit 1
          fi

          if [[ "$TAG" == *-* ]]; then IS_PRERELEASE=true; else IS_PRERELEASE=false; fi
          # Fastlane/F-Droid changelogs are keyed by the highest per-ABI versionCode (x86_64 = 10 * base + 2).
          CHANGELOG_VERSION_CODE=$((BASE_CODE * 10 + 2))
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${CHANGELOG_VERSION_CODE}.txt"
          if [ ! -f "$CHANGELOG_FILE" ]; then
            if [ "$IS_PRERELEASE" = "true" ]; then
              echo "::warning::$CHANGELOG_FILE not found; the pre-release will be published without a Highlights section."
            else
              echo "::error::$CHANGELOG_FILE is required for stable releases (used by GitHub release notes and F-Droid)."
              exit 1
            fi
          fi

          {
            echo "is_prerelease=$IS_PRERELEASE"
            echo "changelog_version_code=$CHANGELOG_VERSION_CODE"
          } >> "$GITHUB_OUTPUT"

  check-reproducibility:
    needs: validate-version
    uses: ./.github/workflows/reproducibility.yml

  build-and-release:
    needs: [validate-version, check-reproducibility]
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: "21"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: '.go-version'
          cache-dependency-path: 'restic/go.sum'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_VER=$(sed -n -E 's/.*ndkVersion = "(.*)".*/\1/p' app/build.gradle.kts | tr -d ' ')
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VER"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - name: Verify Android NDK toolchain
        run: |
          set -euo pipefail
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Build restic binaries
        run: |
          set -euo pipefail
          ./scripts/build_restic.sh

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: |
          set -euo pipefail
          ./gradlew --no-daemon test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-unit-test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/

      - name: Validate signing secrets
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEYSTORE_BASE64"
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"

      - name: Decode keystore
        env:
          ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/android-release-signing.jks"
          printf '%s' "$ANDROID_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_SIGNING_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APKs
        env:
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease

      - name: Collect release APKs
        id: collect_apks
        run: |
          set -euo pipefail
          mapfile -t apks < <(find app/build/outputs/apk -type f -path '*/release/*.apk' | sort)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No APK files were produced."
            exit 1
          fi

          if find app/build/outputs/apk -type f -path '*/release/*unsigned*.apk' | grep -q .; then
            echo "Unsigned APKs were found in release outputs."
            find app/build/outputs/apk -type f -path '*/release/*unsigned*.apk'
            exit 1
          fi

          mkdir -p release-assets
          for apk in "${apks[@]}"; do
            cp "$apk" release-assets/
          done

          {
            echo "files<<EOF"
            find release-assets -type f -name '*.apk' | sort
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum *.apk > SHA256SUMS.txt)

      - name: Collect and compress release mapping
        run: |
          set -euo pipefail
          mapfile -t mappings < <(find app/build/outputs/mapping/release -type f -name 'mapping.txt')
          if [ ${#mappings[@]} -eq 0 ]; then
            mapfile -t mappings < <(find app/build -type f -name 'mapping.txt')
          fi
          if [ ${#mappings[@]} -eq 0 ]; then
            echo "No mapping.txt file found."
            exit 1
          fi
          echo "Found mapping file: ${mappings[0]}"
          gzip -9 -n -c "${mappings[0]}" > release-assets/mapping.txt.gz

      - name: Prepare release notes
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          CHANGELOG_VERSION_CODE: ${{ needs.validate-version.outputs.changelog_version_code }}
        run: |
          set -euo pipefail
          RELEASE_BODY_FILE="$RUNNER_TEMP/release-body.md"
          CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${CHANGELOG_VERSION_CODE}.txt"

          # Always compare against the newest stable release *below* this version, so
          # v0.9.0-beta.1, v0.9.0-beta.2 and v0.9.0 all diff against e.g. v0.8.1.
          BASE_TAG="${TAG%%-*}"
          STABLE_TAGS=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName')
          PREV_STABLE_TAG=$(printf '%s\n' "$STABLE_TAGS" "$BASE_TAG" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -u -V \
            | awk -v base="$BASE_TAG" '$0 == base { exit } { last = $0 } END { print last }')

          notes_args=(-f tag_name="$TAG")
          if [ -n "$PREV_STABLE_TAG" ]; then
            echo "Generating release notes for $TAG against previous stable release $PREV_STABLE_TAG"
            notes_args+=(-f previous_tag_name="$PREV_STABLE_TAG")
          else
            echo "::warning::No previous stable release found; GitHub will pick the comparison base."
          fi
          GENERATED_NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" "${notes_args[@]}" --jq '.body')

          {
            if [ -f "$CHANGELOG_FILE" ]; then
              echo "Using changelog: $CHANGELOG_FILE" >&2
              echo "## Highlights"
              echo ""
              cat "$CHANGELOG_FILE"
              printf '\n\n'
            fi
            printf '%s\n' "$GENERATED_NOTES"
          } > "$RELEASE_BODY_FILE"
          echo "path=$RELEASE_BODY_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Restoid ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          # Notes are generated above against the last stable release; don't let GitHub add a second set.
          generate_release_notes: false
          body_path: ${{ steps.changelog.outputs.path }}
          files: |
            ${{ steps.collect_apks.outputs.files }}
            release-assets/SHA256SUMS.txt
            release-assets/mapping.txt.gz

      - name: Build F-Droid repo index
        env:
          FDROID_REPO_KEYSTORE_BASE64: ${{ secrets.FDROID_REPO_KEYSTORE_BASE64 }}
          FDROID_REPO_KEY_ALIAS: ${{ secrets.FDROID_REPO_KEY_ALIAS }}
          FDROID_REPO_KEYSTORE_PASSWORD: ${{ secrets.FDROID_REPO_KEYSTORE_PASSWORD }}
          FDROID_REPO_KEY_PASSWORD: ${{ secrets.FDROID_REPO_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ needs.validate-version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          test -n "$FDROID_REPO_KEYSTORE_BASE64"
          test -n "$FDROID_REPO_KEY_ALIAS"
          test -n "$FDROID_REPO_KEYSTORE_PASSWORD"
          test -n "$FDROID_REPO_KEY_PASSWORD"

          mkdir -p fdroid/repo
          printf '%s' "$FDROID_REPO_KEYSTORE_BASE64" | base64 --decode > fdroid/keystore.jks
          chmod 600 fdroid/keystore.jks

          # archive_older: 0 -> keep every APK we put in repo/; the selection below is explicit
          # (current tag + last 2 stable releases), so fdroidserver must not archive any of them.
          cat > fdroid/config.yml <<EOF
          repo_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/fdroid/repo
          repo_name: ${{ github.event.repository.name }}
          repo_description: Releases published from GitHub tags for ${{ github.event.repository.name }}.
          keystore: keystore.jks
          keystorepass: ${FDROID_REPO_KEYSTORE_PASSWORD}
          keypass: ${FDROID_REPO_KEY_PASSWORD}
          repo_keyalias: ${FDROID_REPO_KEY_ALIAS}
          archive_older: 0
          EOF
          chmod 600 fdroid/config.yml

          APP_ID="io.github.hddq.restoid"
          mkdir -p "fdroid/metadata/$APP_ID"
          cp -r fastlane/metadata/android/* "fdroid/metadata/$APP_ID/"
          for lang_dir in "fdroid/metadata/$APP_ID"/*; do
            if [ -d "$lang_dir" ]; then
              (
                cd "$lang_dir"
                [ -f full_description.txt ] && mv full_description.txt description.txt
                [ -f short_description.txt ] && mv short_description.txt summary.txt
                [ -f title.txt ] && mv title.txt name.txt
                if [ -d "images" ]; then
                  mv images/* .
                  rm -rf images
                fi
              )
            fi
          done

          suggested_candidates=""
          current_copied=false
          for apk in release-assets/*.apk; do
            [ -e "$apk" ] || continue
            filename=$(basename "$apk")
            if [[ "$filename" == *"universal"* ]]; then
              echo "Skipping universal APK for F-Droid: $filename"
              continue
            fi
            new_filename="${filename%.*}-${TAG}.apk"
            cp "$apk" "fdroid/repo/$new_filename"
            current_copied=true
          done
          if [ "$IS_PRERELEASE" != "true" ] && [ "$current_copied" = true ]; then
            suggested_candidates="$TAG"
          fi

          # Besides the current tag, keep the 2 newest *stable* releases. Pre-releases are
          # excluded, so a beta tag never pushes stable builds out of the repo, and a stable
          # tag never carries older betas along.
          STABLE_TAGS=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName')
          old_tags=$(printf '%s\n' "$STABLE_TAGS" \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -vxF "$TAG" \
            | sort -u -V -r \
            | head -n 2 || true)

          for tag in $old_tags; do
            echo "Processing older stable release: $tag"
            mkdir -p "temp_dl_$tag"
            if ! gh release download "$tag" --pattern "*.apk" --dir "temp_dl_$tag"; then
              echo "::warning::Failed to download APKs for older stable release $tag; skipping."
              rm -rf "temp_dl_$tag"
              continue
            fi

            tag_copied=false
            for apk in "temp_dl_$tag"/*.apk; do
              [ -e "$apk" ] || continue
              filename=$(basename "$apk")
              if [[ "$filename" == *"universal"* ]]; then
                echo "Skipping universal APK for F-Droid from previous release ($tag): $filename"
                continue
              fi
              new_filename="${filename%.*}-${tag}.apk"
              mv "$apk" "fdroid/repo/$new_filename"
              tag_copied=true
            done
            rm -rf "temp_dl_$tag"

            if [ "$tag_copied" = true ]; then
              suggested_candidates=$(printf '%s\n%s' "$suggested_candidates" "$tag")
            fi
          done

          # Suggested version (CurrentVersion/CurrentVersionCode) = newest stable release in the repo.
          SUGGESTED_TAG=$(printf '%s\n' "$suggested_candidates" | sed '/^$/d' | sort -V | tail -n 1 || true)

          SUGGESTED_CODE=""
          if [ -n "$SUGGESTED_TAG" ]; then
            BUILD_TOOLS=$(sed -n -E 's/.*buildToolsVersion = "(.*)".*/\1/p' app/build.gradle.kts | tr -d ' ')
            AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt2"
            if [ ! -x "$AAPT2" ]; then
              AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)
            fi
            test -x "$AAPT2"

            # Highest versionCode across that release's per-ABI APKs (x86_64 = 10 * base + 2), so the
            # F-Droid client suggests the matching build for every ABI and shows <code>.txt as "What's new".
            for apk in fdroid/repo/*-"${SUGGESTED_TAG}".apk; do
              [ -e "$apk" ] || continue
              code=$("$AAPT2" dump badging "$apk" | sed -n -E "s/^package: .*versionCode='([0-9]+)'.*/\1/p")
              echo "  $(basename "$apk"): versionCode=$code"
              if [ -n "$code" ] && { [ -z "$SUGGESTED_CODE" ] || [ "$code" -gt "$SUGGESTED_CODE" ]; }; then
                SUGGESTED_CODE="$code"
              fi
            done
            if [ -z "$SUGGESTED_CODE" ]; then
              echo "::error::Could not determine versionCode for latest stable release $SUGGESTED_TAG."
              exit 1
            fi
            echo "Suggested version: ${SUGGESTED_TAG#v} ($SUGGESTED_CODE)"
          elif [ "$IS_PRERELEASE" = "true" ] && [ -n "$old_tags" ]; then
            echo "::error::Failed to download APKs for any previous stable release; refusing to publish pre-release without a stable suggested version."
            exit 1
          else
            echo "::warning::No stable release available; fdroid will suggest the highest versionCode in the repo."
          fi

          cat > "fdroid/metadata/${APP_ID}.yml" <<EOF
          Categories:
            - System
          License: GPL-3.0-only
          AuthorName: hddq
          SourceCode: https://github.com/hddq/restoid
          IssueTracker: https://github.com/hddq/restoid/issues
          Translation: https://crowdin.com/project/restoid
          EOF
          if [ -n "$SUGGESTED_CODE" ]; then
            {
              echo "CurrentVersion: '${SUGGESTED_TAG#v}'"
              echo "CurrentVersionCode: ${SUGGESTED_CODE}"
            } >> "fdroid/metadata/${APP_ID}.yml"
          fi
          echo "--- fdroid/metadata/${APP_ID}.yml ---"
          cat "fdroid/metadata/${APP_ID}.yml"
          echo "--- fdroid/repo ---"
          ls -1 fdroid/repo

          docker run --rm -v "${PWD}/fdroid:/fdroid" -w /fdroid debian:testing bash -c "apt-get update && apt-get install -y fdroidserver aapt && fdroid update --create-metadata"
          sudo chown -R $USER:$USER fdroid
          rm -f fdroid/keystore.jks fdroid/config.yml

      - name: Publish F-Droid repo to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: fdroid/repo
          destination_dir: fdroid/repo
          keep_files: false
          force_orphan: true

      - name: Remove signing keystore
        if: always()
        run: |
          if [ -n "${ANDROID_SIGNING_KEYSTORE_FILE:-}" ] && [ -f "$ANDROID_SIGNING_KEYSTORE_FILE" ]; then
            shred -u "$ANDROID_SIGNING_KEYSTORE_FILE" || rm -f "$ANDROID_SIGNING_KEYSTORE_FILE"
          fi
