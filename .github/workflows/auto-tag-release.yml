name: Auto-Tag Release

on:
  push:
    branches:
      - master
    paths:
      - "app/build.gradle.kts"

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.validate.outputs.should_release }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate release metadata
        id: validate
        run: |
          set -euo pipefail
          GRADLE_FILE=app/build.gradle.kts

          VERSION_NAME=$(sed -n -E 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' "$GRADLE_FILE")
          BASE_CODE=$(sed -n -E 's/^val baseAppVersionCode = ([0-9]+).*/\1/p' "$GRADLE_FILE")
          DEFAULT_CODE=$(sed -n -E 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' "$GRADLE_FILE")

          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not parse versionName from $GRADLE_FILE."
            exit 1
          fi

          TAG="v${VERSION_NAME}"
          echo "Detected versionName=$VERSION_NAME (tag=$TAG), baseAppVersionCode=$BASE_CODE, defaultConfig.versionCode=$DEFAULT_CODE"

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Derived tag '$TAG' must look like vX.Y.Z or vX.Y.Z-<pre-release> (e.g. v0.9.0-beta.1)."
            exit 1
          fi

          EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/${TAG}")
          if [ -n "$EXISTING_TAG" ]; then
            echo "Tag '${TAG}' already exists on origin; nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BASE_CODE" ] || [ "$BASE_CODE" != "$DEFAULT_CODE" ]; then
            echo "::error::baseAppVersionCode ($BASE_CODE) and defaultConfig versionCode ($DEFAULT_CODE) must be equal before tagging."
            exit 1
          fi

          if [[ "$TAG" != *-* ]]; then
            CHANGELOG_VERSION_CODE=$((BASE_CODE * 10 + 2))
            CHANGELOG_FILE="fastlane/metadata/android/en-US/changelogs/${CHANGELOG_VERSION_CODE}.txt"
            if [ ! -f "$CHANGELOG_FILE" ]; then
              echo "::error::$CHANGELOG_FILE is required for stable releases; refusing to create tag '${TAG}'."
              exit 1
            fi
          fi

          {
            echo "should_release=true"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  crowdin-sync:
    needs: validate
    if: needs.validate.outputs.should_release == 'true' && github.repository_owner == 'hddq'
    uses: ./.github/workflows/crowdin.yml
    secrets: inherit

  merge-and-tag:
    needs: [validate, crowdin-sync]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.validate.outputs.should_release == 'true' &&
      (needs.crowdin-sync.result == 'success' ||
        (needs.crowdin-sync.result == 'skipped' && github.repository_owner != 'hddq'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Merge Crowdin PR if present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(gh pr list --base master --head crowdin --state open --json number --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open Crowdin PR found; proceeding to tag master."
            exit 0
          fi

          echo "Found open Crowdin PR #${PR_NUMBER}; waiting for mergeable status..."
          MERGEABLE="UNKNOWN"
          for _ in $(seq 1 15); do
            MERGEABLE=$(gh pr view "$PR_NUMBER" --json mergeable --jq '.mergeable')
            if [ "$MERGEABLE" != "UNKNOWN" ]; then
              break
            fi
            sleep 2
          done

          if [ "$MERGEABLE" != "MERGEABLE" ]; then
            echo "::error::Crowdin PR #${PR_NUMBER} is not mergeable (status: ${MERGEABLE})."
            exit 1
          fi

          gh pr merge "$PR_NUMBER" --squash
          echo "Merged Crowdin PR #${PR_NUMBER} into master."

      - name: Create release tag and trigger Android Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch origin master
          git checkout -B master origin/master

          GRADLE_FILE=app/build.gradle.kts
          CURRENT_VERSION=$(sed -n -E 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' "$GRADLE_FILE")
          if [ "v${CURRENT_VERSION}" != "$TAG" ]; then
            echo "::error::master versionName ('v${CURRENT_VERSION}') no longer matches expected tag '${TAG}'; aborting."
            exit 1
          fi

          EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/${TAG}")
          if [ -n "$EXISTING_TAG" ]; then
            echo "Tag '${TAG}' already exists on origin; nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/${TAG}"

          gh workflow run android-release.yml --ref "refs/tags/${TAG}"
          echo "Created tag '${TAG}' on $(git rev-parse --short HEAD) and dispatched android-release.yml."
