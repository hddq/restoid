name: Update Screenshots

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-screenshots
  cancel-in-progress: true

jobs:
  capture-screenshots:
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: "21"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: '.go-version'
          cache-dependency-path: |
            restic/go.sum
            rclone/go.sum

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_VER=$(sed -n -E 's/.*ndkVersion = "(.*)".*/\1/p' app/build.gradle.kts | tr -d ' ')
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;$NDK_VER"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VER" >> "$GITHUB_ENV"

      - name: Build restic binaries
        run: |
          set -euo pipefail
          ./scripts/build_restic.sh

      - name: Build rclone binaries
        run: |
          set -euo pipefail
          ./scripts/build_rclone.sh

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/capture_screenshots.sh

      - name: Upload generated screenshots artifact
        uses: actions/upload-artifact@v7
        with:
          name: phone-screenshots-en-US
          path: fastlane/metadata/android/en-US/images/phoneScreenshots/*.png

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          base: master
          branch: docs/update-screenshots
          delete-branch: true
          commit-message: "docs(metadata): update phone screenshots"
          title: "docs(metadata): update phone screenshots"
          body: |
            Automated screenshot refresh generated by `StoreScreenshotsTest` (dark mode, `en-US`, `1080x2400`).

            Please review the updated screenshots in `fastlane/metadata/android/en-US/images/phoneScreenshots/` before merging.
          add-paths: fastlane/metadata/android/en-US/images/phoneScreenshots
